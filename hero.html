<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero — halftone hands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .hero {
        position: relative;
        height: 100svh;
        min-height: 30rem;
        overflow: hidden;
      }

      /* the dotted hands live here, behind everything */
      #hands {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* keeps the middle readable without washing the dots out */
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          62% 55% at 50% 42%,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.45) 45%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      .layer {
        position: relative;
        z-index: 2;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1.25rem, 2.6vh, 2.25rem) clamp(1.25rem, 4vw, 3.5rem);
      }

      .eyebrow {
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
        font-size: clamp(0.5rem, 0.78vw, 0.66rem);
        font-weight: 400;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        text-align: center;
        color: rgba(255, 255, 255, 0.42);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.75rem, 4.5vh, 3.25rem);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5.4vw, 4.6rem);
        font-weight: 500;
        line-height: 1.06;
        letter-spacing: -0.035em;
        max-width: 16ch;
        text-wrap: balance;
      }

      /* ── terminal card ─────────────────────────────────────────── */
      .term {
        width: min(24rem, 76vw);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 0.6rem;
        background: rgba(8, 8, 10, 0.82);
        backdrop-filter: blur(6px);
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.9);
        overflow: hidden;
        text-align: left;
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
      }

      .term-bar {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.7rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        background: rgba(255, 255, 255, 0.035);
      }

      .term-bar i {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.24);
        flex: none;
      }

      .term-title {
        flex: 1;
        text-align: center;
        font-size: 0.53rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
        /* balances the three dots so the label sits dead centre */
        margin-right: 1.7rem;
      }

      .term-body {
        padding: 0.85rem 0.9rem 1rem;
        font-size: clamp(0.56rem, 0.82vw, 0.7rem);
        line-height: 1.85;
      }

      .term-body .row {
        display: grid;
        grid-template-columns: 1.4rem 1fr;
        gap: 0.4rem;
      }

      .ln {
        color: rgba(255, 255, 255, 0.22);
        text-align: right;
        user-select: none;
      }

      .pun {
        color: rgba(255, 255, 255, 0.45);
      }
      .key {
        color: #7aa2f7;
      }
      .str {
        color: #e0af68;
      }

      .caret {
        display: inline-block;
        width: 0.45em;
        height: 1em;
        translate: 0 0.14em;
        background: rgba(255, 255, 255, 0.75);
        animation: blink 1.1s steps(1, end) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* ── bottom-left label ─────────────────────────────────────── */
      .foot {
        display: flex;
        align-items: flex-end;
      }

      .tag {
        display: inline-block;
        background: #fff;
        color: #000;
        font-size: clamp(1rem, 2.1vw, 1.75rem);
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1;
        padding: 0.62em 0.78em 0.7em;
        border-radius: 0.42rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .caret {
          animation: none;
        }
      }

      @media (max-width: 34rem) {
        .eyebrow {
          letter-spacing: 0.24em;
        }
        h1 {
          font-size: 2.1rem;
          max-width: 13ch;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <canvas id="hands" aria-hidden="true"></canvas>

      <div class="layer">
        <p class="eyebrow">
          AI Automation &nbsp;•&nbsp; Full Stack Development &nbsp;•&nbsp;
          Builder
        </p>

        <div class="center">
          <h1>translating your ideas into future-proof digital reality.</h1>

          <div class="term">
            <div class="term-bar">
              <i></i><i></i><i></i>
              <span class="term-title">aaronrecato — developer.json</span>
            </div>
            <div class="term-body">
              <div class="row"><span class="ln">1</span><span class="pun">{</span></div>
              <div class="row">
                <span class="ln">2</span>
                <span
                  ><span class="key">"name"</span><span class="pun">:</span>
                  <span class="str">"Aaron Recato"</span><span class="pun">,</span></span
                >
              </div>
              <div class="row">
                <span class="ln">3</span>
                <span
                  ><span class="key">"origin"</span><span class="pun">:</span>
                  <span class="str">"Philippines"</span><span class="pun">,</span></span
                >
              </div>
              <div class="row">
                <span class="ln">4</span>
                <span
                  ><span class="key">"status"</span><span class="pun">:</span>
                  <span class="str">"student_developer"</span></span
                >
              </div>
              <div class="row">
                <span class="ln">5</span
                ><span><span class="pun">}</span> <span class="caret"></span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="foot"><span class="tag">my dev portfolio</span></div>
      </div>
    </section>

    <script>
      /* ───────────────────────────────────────────────────────────
         Halftone hands.

         Two passes: the hands are drawn as solid, rim-lit shapes on
         an offscreen canvas, then that canvas is resampled on a grid
         and replayed as dots whose radius tracks local brightness.
         Nothing is bitmap-sourced, so it stays crisp at any size.
         ─────────────────────────────────────────────────────────── */

      const view = document.getElementById("hands");
      const vctx = view.getContext("2d");
      const src = document.createElement("canvas");
      const sctx = src.getContext("2d", { willReadFrequently: true });

      const SPACING = 5.2; // dot grid pitch, CSS px
      const DOT_MAX = 2.05; // dot radius at full brightness, CSS px

      /* Convex hull of two circles — one finger bone, one palm slab. */
      function bone(ctx, x1, y1, r1, x2, y2, r2) {
        const dx = x2 - x1,
          dy = y2 - y1;
        const d = Math.hypot(dx, dy);
        ctx.beginPath();
        if (d <= Math.abs(r1 - r2)) {
          const big = r1 > r2 ? [x1, y1, r1] : [x2, y2, r2];
          ctx.arc(big[0], big[1], big[2], 0, Math.PI * 2);
          return;
        }
        const th = Math.atan2(dy, dx);
        const phi = Math.acos((r1 - r2) / d);
        ctx.arc(x1, y1, r1, th + phi, th - phi + Math.PI * 2);
        ctx.arc(x2, y2, r2, th - phi, th + phi);
        ctx.closePath();
      }

      /* A hand in local units: palm at the origin, fingers toward +x,
         forearm running off toward -x. Segments overlap on purpose —
         the seams read as knuckles once they are dotted. */
      const SEGMENTS = [
        [-330, -26, 40, -70, -4, 54], // forearm
        [-70, -4, 54, 26, 2, 50], // palm
        [26, -32, 20, 112, -50, 17], // index, extended
        [112, -50, 17, 156, -58, 13], //   .. tip
        [30, -8, 20, 96, -18, 17], // middle, curled
        [96, -18, 17, 80, 22, 13],
        [26, 20, 19, 88, 16, 16], // ring, curled
        [88, 16, 16, 70, 50, 12],
        [18, 44, 16, 70, 44, 13], // pinky, curled
        [70, 44, 13, 56, 70, 10],
        [-24, 38, 22, 44, 66, 17], // thumb
        [44, 66, 17, 82, 74, 13], //   .. tip
      ];

      /* Joints get a bright ring — that is most of the "mechanical" read. */
      const JOINTS = [
        [26, -32, 22],
        [30, -8, 22],
        [26, 20, 21],
        [18, 44, 18],
        [112, -50, 18],
        [96, -18, 18],
        [88, 16, 17],
        [70, 44, 14],
        [44, 66, 18],
        [-40, 0, 46],
      ];

      function drawHand(ctx, cx, cy, scale, deg, mirror) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((deg * Math.PI) / 180);
        ctx.scale(scale, scale * (mirror ? -1 : 1));

        // fill: dark body with a lit upper edge, so the dots thin out
        // across the middle instead of forming a flat slab
        const shade = ctx.createLinearGradient(0, -150, 0, 150);
        shade.addColorStop(0, "#5a5a5a");
        shade.addColorStop(0.38, "#161616");
        shade.addColorStop(1, "#050505");

        for (const [x1, y1, r1, x2, y2, r2] of SEGMENTS) {
          bone(ctx, x1, y1, r1, x2, y2, r2);
          ctx.fillStyle = shade;
          ctx.fill();
          ctx.lineWidth = 6;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();
        }

        ctx.lineWidth = 4.5;
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        for (const [x, y, r] of JOINTS) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function render() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = view.clientWidth;
        const h = view.clientHeight;
        if (!w || !h) return;

        for (const c of [view, src]) {
          c.width = Math.round(w * dpr);
          c.height = Math.round(h * dpr);
        }

        sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sctx.clearRect(0, 0, w, h);
        sctx.fillStyle = "#000";
        sctx.fillRect(0, 0, w, h);

        // one scale for both hands, so they read as a matched pair
        const s = Math.min(w / 1440, h / 810) * 1.85;

        // upper-left hand, reaching down toward the centre
        drawHand(sctx, w * 0.02, h * 0.02, s, 34, false);
        // lower-right hand, reaching back up — mirrored so the palm turns over
        drawHand(sctx, w * 0.99, h * 1.0, s, 214, true);

        const px = sctx.getImageData(0, 0, src.width, src.height).data;
        const step = SPACING * dpr;

        vctx.setTransform(1, 0, 0, 1, 0, 0);
        vctx.clearRect(0, 0, view.width, view.height);
        vctx.fillStyle = "#fff";

        for (let y = step / 2; y < src.height; y += step) {
          const row = (y | 0) * src.width;
          for (let x = step / 2; x < src.width; x += step) {
            const lum = px[(row + (x | 0)) * 4] / 255;
            if (lum < 0.08) continue;
            const r = DOT_MAX * dpr * Math.pow(lum, 0.85);
            if (r < 0.22) continue;
            vctx.beginPath();
            vctx.arc(x, y, r, 0, Math.PI * 2);
            vctx.fill();
          }
        }
      }

      let raf;
      const schedule = () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(render);
      };

      new ResizeObserver(schedule).observe(view);
      addEventListener("resize", schedule);
      schedule();
    </script>
  </body>
</html>
